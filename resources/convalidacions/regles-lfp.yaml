version: '0.4'
metadata:
  title: Regles de convalidació LFP
  source:
    description: Transcripció estructurada de les fulles de convalidació del CIP FP Batoi
    ignore_handwritten_annotations: true
  conventions:
    proposal_actions:
      convalidate: Es pot proposar la convalidació o reconeixement
      refer: Cal trametre el cas perquè el resolga l'òrgan competent
    resolution_authorities:
      centre: Resolució pel centre
      ministry: Reservat per als casos competència del Ministeri (p. ex. estudis universitaris o FP1/FP2)
    result_statuses:
      AA: Aprovat amb anterioritat
      CO: Convalidat
    grade_modes:
      preserve: Manté la qualificació numèrica aportada
      none: Sense qualificació numèrica
    notes:
      - En les regles d'aquest document, la resolució correspon al centre.
      - La menció «Circular Ministeri» és una referència/instrucció aplicable, no l'òrgan resolutor.
      - La competència del Ministeri es reserva per a altres supòsits, com estudis universitaris o FP1/FP2.
      - Els únics resultats finals modelats són AA i CO.
      - No s'han incorporat anotacions manuscrites.
      - Els noms dels mòduls es mantenen amb normalització mínima respecte de les fulles originals.
